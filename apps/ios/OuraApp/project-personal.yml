# Model-free public iPhone build. Personal signing lives only in Signing.local.xcconfig.
name: OuraApp
options:
  bundleIdPrefix: org.openhealth
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "48"
    PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID)"
    TARGETED_DEVICE_FAMILY: "1"   # iPhone only (no iPad multitasking orientation reqs)
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_ENTITLEMENTS: PersonalHealth.entitlements
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) PERSONAL_HEALTH"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) PERSONAL_HEALTH DEBUG"

targets:
  OuraApp:
    type: application
    platform: iOS
    configFiles:
      Debug: Public.xcconfig
      Release: Public.xcconfig
    settings:
      base:
        INFOPLIST_FILE: Info-personal.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        TARGETED_DEVICE_FAMILY: "1"   # iPhone-only (target-level, overrides xcodegen's 1,2 default)
        OTHER_LDFLAGS: [-lsqlite3]
    sources:
      - path: OuraApp.swift
      - path: Models.swift
      - path: Core.swift
      - path: WorkCoordinator.swift
      - path: Components.swift
      - path: Reports.swift
      - path: DayExport.swift
      - path: RawData.swift
      - path: HeartRate.swift
      - path: Theme.swift
      - path: BLETransport.swift
      - path: RingSync.swift
      - path: ProfileSettings.swift
      - path: ModelProgress.swift
      - path: CrashCatch.c
      - path: CrashCatch.h
      - path: Diagnostics.swift
      - path: HealthExport.swift
      - path: Personal
      - path: LaunchScreen.storyboard
      - path: ../generated/oura_core.swift
      - path: Assets.xcassets
    dependencies:
      - sdk: HealthKit.framework
      - framework: ../OuraCore.xcframework
        embed: false

  OuraAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PersonalTests
    dependencies:
      - target: OuraApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  OuraApp:
    build:
      targets:
        OuraApp: all
    test:
      targets: [OuraAppTests]
